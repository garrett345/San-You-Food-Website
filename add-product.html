<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AEE 产品添加工具</title>
<style>
body{margin:0;background:#f7f3ea;color:#21322d;font-family:-apple-system,Arial,"PingFang SC",sans-serif;line-height:1.5}
.w{max-width:720px;margin:auto;padding:22px 18px 80px}
h1{font-size:24px;margin:0 0 4px}h2{font-size:17px;margin:0 0 10px}
.sub{color:#6d7772;font-size:14px;margin:0 0 20px}
.box{background:#fffdf8;border:1px solid #ddd8ce;border-radius:18px;padding:18px;margin-bottom:16px}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 4px}
input[type=text]{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #ddd8ce;border-radius:10px;font:inherit;background:#fff}
input[type=file]{width:100%;font:inherit}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:12px 20px;background:#254b3d;color:#fff;cursor:pointer}
button.s{background:#fff;color:#254b3d;border:1px solid #254b3d;padding:6px 12px;font-size:13px}
button:disabled{opacity:.4}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #eee}
.row:first-child{border-top:0}.row img{width:54px;height:54px;object-fit:contain;background:#fff;border:1px solid #eee;border-radius:8px}
.row .n{flex:1;font-size:14px;font-weight:700}.row .n small{display:block;font-weight:400;color:#6d7772}
#prev{max-width:150px;max-height:150px;display:none;margin-top:10px;border:1px solid #eee;border-radius:10px;background:#fff}
.ok{color:#254b3d;font-weight:700}.warn{color:#b3402b;font-size:14px}
</style></head><body><div class="w">
<h1>产品添加工具</h1>
<p class="sub">自己往产品页顶部的滑动展示里加、删、调整产品。全部在你的浏览器里完成，图片不会上传到任何地方。</p>

<div class="box"><h2>① 选择你的网页文件</h2>
<label>英文页 products.html</label><input type="file" id="fEn" accept=".html,text/html">
<label>中文页 products-zh.html（可选）</label><input type="file" id="fZh" accept=".html,text/html">
<p id="st1" class="warn"></p></div>

<div class="box" id="listBox" style="display:none"><h2>② 当前产品（可上移 / 下移 / 删除）</h2><div id="list"></div></div>

<div class="box" id="addBox" style="display:none"><h2>③ 添加新产品</h2>
<label>产品图片</label><input type="file" id="img" accept="image/*"><img id="prev" alt="">
<label>英文名称</label><input type="text" id="nEn" placeholder="例如 Lemon Sandwich Biscuits">
<label>英文说明</label><input type="text" id="dEn" placeholder="例如 Lemon flavour · 168g">
<label>中文名称</label><input type="text" id="nZh" placeholder="例如 柠檬味夹心饼干">
<label>中文说明</label><input type="text" id="dZh" placeholder="例如 柠檬味 · 168g">
<p><button id="add">添加到最后</button></p><p id="st3"></p></div>

<div class="box" id="saveBox" style="display:none"><h2>④ 保存</h2>
<p style="font-size:14px;margin:0 0 12px">改好后点下面按钮，保存文件并替换你网站里原来的同名文件。</p>
<p><button id="dEnBtn">保存 products.html</button></p>
<p><button id="dZhBtn">保存 products-zh.html</button></p></div>
</div>
<script>
var docs={en:null,zh:null},names={en:'products.html',zh:'products-zh.html'};
function $(i){return document.getElementById(i)}
function read(file,key){
  return new Promise(function(ok){var r=new FileReader();r.onload=function(){
    var d=new DOMParser().parseFromString(r.result,'text/html');
    var sc=d.querySelector('.pcar-scroller');
    if(!sc){$('st1').textContent='这个文件里没有找到滑动展示区（.pcar-scroller），请选择我给你的最新版本。';ok(false);return}
    docs[key]=d;names[key]=file.name;ok(true)};r.readAsText(file)});
}
function items(k){return docs[k]?[].slice.call(docs[k].querySelectorAll('.pcar-scroller .pcar-item')):[]}
function refresh(){
  var en=items('en');
  $('listBox').style.display=$('addBox').style.display=$('saveBox').style.display=docs.en?'block':'none';
  $('dZhBtn').style.display=docs.zh?'inline-block':'none';
  var L=$('list');L.innerHTML='';
  en.forEach(function(it,i){
    var r=document.createElement('div');r.className='row';
    r.innerHTML='<img alt=""><div class="n"></div>';
    r.querySelector('img').src=it.querySelector('img').getAttribute('src');
    r.querySelector('.n').innerHTML='<span></span><small></small>';
    r.querySelector('span').textContent=it.querySelector('h3').textContent;
    r.querySelector('small').textContent=it.querySelector('p').textContent;
    [['↑',-1],['↓',1],['删除',0]].forEach(function(b){
      var x=document.createElement('button');x.className='s';x.textContent=b[0];
      x.onclick=function(){act(i,b[1])};r.appendChild(x)});
    L.appendChild(r)});
}
function act(i,d){
  ['en','zh'].forEach(function(k){
    var a=items(k);if(!a[i])return;var it=a[i],p=it.parentNode;
    if(d===0){p.removeChild(it)}
    else if(d<0&&a[i-1]){p.insertBefore(it,a[i-1])}
    else if(d>0&&a[i+1]){p.insertBefore(a[i+1],it)}
  });refresh();
}
$('fEn').onchange=function(){if(this.files[0])read(this.files[0],'en').then(function(o){if(o){$('st1').textContent='';refresh()}})};
$('fZh').onchange=function(){if(this.files[0])read(this.files[0],'zh').then(function(){refresh()})};
var cur=null;
$('img').onchange=function(){
  var f=this.files[0];if(!f)return;
  var u=URL.createObjectURL(f),im=new Image();
  im.onload=function(){
    var m=760,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
    cur=c.toDataURL('image/jpeg',.82);$('prev').src=cur;$('prev').style.display='block';URL.revokeObjectURL(u)};
  im.src=u;
};
function mk(d,n,t,src){
  var it=d.createElement('div');it.className='pcar-item';
  it.innerHTML='<div class="pic"><img draggable="false"></div><div class="cap"><h3></h3><p></p></div>';
  var g=it.querySelector('img');g.setAttribute('src',src);g.setAttribute('alt',n);
  it.querySelector('h3').textContent=n;it.querySelector('p').textContent=t;return it;
}
$('add').onclick=function(){
  if(!cur){$('st3').innerHTML='<span class="warn">请先选择产品图片。</span>';return}
  var nEn=$('nEn').value.trim();if(!nEn){$('st3').innerHTML='<span class="warn">请填写英文名称。</span>';return}
  docs.en.querySelector('.pcar-scroller').appendChild(mk(docs.en,nEn,$('dEn').value.trim(),cur));
  if(docs.zh)docs.zh.querySelector('.pcar-scroller').appendChild(mk(docs.zh,$('nZh').value.trim()||nEn,$('dZh').value.trim()||$('dEn').value.trim(),cur));
  cur=null;$('img').value='';$('prev').style.display='none';['nEn','dEn','nZh','dZh'].forEach(function(i){$(i).value=''});
  $('st3').innerHTML='<span class="ok">已添加。继续添加，或到 ④ 保存。</span>';refresh();
};
function save(k){
  var html='<!DOCTYPE html>\n'+docs[k].documentElement.outerHTML;
  var f=new File([html],names[k],{type:'text/html'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(function(){dl(f)})}else dl(f);
}
function dl(f){var a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},500)}
$('dEnBtn').onclick=function(){save('en')};$('dZhBtn').onclick=function(){save('zh')};
</script></body></html>
